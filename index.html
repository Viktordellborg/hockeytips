<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hockeytips</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; color: #1b2733; }
    .scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: 0.4rem 0.6rem; text-align: right; border-bottom: 1px solid #dde3e9; white-space: nowrap; }
    th:nth-child(2), td:nth-child(2) { text-align: left; }
    td:last-child { font-weight: bold; }
    #matcher h3 { margin: 1.2rem 0 0.3rem; }
    #matcher ul { list-style: none; margin: 0; padding: 0; }
    #matcher li { display: flex; gap: 1rem; padding: 0.4rem 0.6rem; border-bottom: 1px solid #dde3e9; }
    #matcher .tid { font-variant-numeric: tabular-nums; color: #5b6b7a; }
    #matcher .form { color: #5b6b7a; font-size: 0.85rem; }
    #matcher .tips { margin-left: auto; text-align: right; font-weight: bold; }
    tbody tr:hover { background: #f1f5f9; }
  </style>
</head>
<body>
  <h1>Hockeytips</h1>

  <h2>Kommande matcher</h2>
  <p id="matchstatus">Hämtar matcherna …</p>
  <p>Tipset är laget med flest poäng på sina 5 senaste matcher (V = 2, Ö = 1, F = 0).
     Vid lika väljs laget med högst andel av möjliga poäng i tabellen, annars hemmalaget. Bara för skojs skull.</p>
  <div id="matcher"></div>

  <h2>Tabellen</h2>
  <p id="status">Hämtar tabellen …</p>
  <div class="scroll">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Lag</th>
          <th title="Spelade matcher">M</th>
          <th title="Vinster">V</th>
          <th title="Förluster">F</th>
          <th title="Förluster efter förlängning eller straffar">ÖF</th>
          <th title="Målskillnad">+/−</th>
          <th title="Vinster, förluster och förlängningsförluster senaste 10">Senaste 10</th>
          <th title="Poäng">P</th>
        </tr>
      </thead>
      <tbody id="tabell"></tbody>
    </table>
  </div>

  <script>
    // Hämtar en JSON-fil och gör om den till ett objekt. Används av båda funktionerna nedan.
    async function hamtaJson(adress) {
      const svar = await fetch(adress);
      if (!svar.ok) throw new Error("HTTP " + svar.status);
      return svar.json();
    }

    async function visaMatcher() {
      const status = document.getElementById("matchstatus");
      try {
        // Promise.all: hämta tre filer samtidigt och vänta tills alla är klara.
        const [data, form, tabell] = await Promise.all([
          hamtaJson("data/schedule.json"),
          hamtaJson("data/form.json"),
          hamtaJson("data/standings.json"),
        ]);
        // Map: som Dictionary i C# eller HashMap i Java. Förkortning -> andel av möjliga poäng.
        const andelar = new Map(tabell.standings.map(l => [l.teamAbbrev.default, l.pointPctg]));

        // flatMap: slå ihop dagarnas listor till en. filter: behåll bara matcher som inte har börjat.
        const matcher = data.gameWeek
          .flatMap(dag => dag.games)
          .filter(m => m.gameScheduleState === "OK" && new Date(m.startTimeUTC) > new Date())
          .sort((a, b) => a.startTimeUTC.localeCompare(b.startTimeUTC));

        const yta = document.getElementById("matcher");
        let senasteDag = "";
        let lista;
        for (const match of matcher) {
          // Tiden är i UTC i filen. Webbläsaren räknar om den till besökarens tidszon.
          const start = new Date(match.startTimeUTC);
          const dag = start.toLocaleDateString("sv-SE", { weekday: "long", day: "numeric", month: "long" });
          if (dag !== senasteDag) {
            const rubrik = document.createElement("h3");
            rubrik.textContent = dag;
            lista = document.createElement("ul");
            yta.append(rubrik, lista);
            senasteDag = dag;
          }

          const tid = document.createElement("span");
          tid.className = "tid";
          tid.textContent = start.toLocaleTimeString("sv-SE", { hour: "2-digit", minute: "2-digit" });
          const lag = document.createElement("span");
          lag.textContent = lagnamn(match.homeTeam) + " – " + lagnamn(match.awayTeam);
          const formrad = document.createElement("div");
          formrad.className = "form";
          formrad.textContent = "Form: " + formtext(form, match.homeTeam) + " – " + formtext(form, match.awayTeam);
          const mitten = document.createElement("div");
          mitten.append(lag, formrad);

          const tips = document.createElement("span");
          tips.className = "tips";
          tips.textContent = "Tips: " + valjTips(match, form, andelar).commonName.default;

          const rad = document.createElement("li");
          rad.append(tid, mitten, tips);
          lista.append(rad);
        }

        status.textContent = matcher.length > 0
          ? matcher.length + " matcher. Hemmalaget står först, tiderna är i din tidszon."
          : "Inga kommande matcher i den sparade filen.";
      } catch (fel) {
        console.error(fel);
        status.textContent = "Kunde inte läsa matcherna.";
      }
    }

    // Poäng på de 5 senaste matcherna: 2 för V, 1 för Ö, 0 för F.
    function formpoang(form, lag) {
      const poang = { V: 2, "Ö": 1, F: 0 };
      return (form[lag.abbrev] ?? []).reduce((summa, r) => summa + poang[r], 0);
    }

    function formtext(form, lag) {
      return (form[lag.abbrev] ?? []).join("") + " (" + formpoang(form, lag) + ")";
    }

    function valjTips(match, form, andelar) {
      const hemma = formpoang(form, match.homeTeam);
      const borta = formpoang(form, match.awayTeam);
      if (hemma !== borta) return hemma > borta ? match.homeTeam : match.awayTeam;

      const hemmaAndel = andelar.get(match.homeTeam.abbrev) ?? 0;
      const bortaAndel = andelar.get(match.awayTeam.abbrev) ?? 0;
      return bortaAndel > hemmaAndel ? match.awayTeam : match.homeTeam;
    }

    function lagnamn(lag) {
      return lag.placeName.default + " " + lag.commonName.default;
    }

    // async/await fungerar ungefär som i C#: vänta på svaret utan att låsa sidan.
    async function visaTabell() {
      const status = document.getElementById("status");
      try {
        // Relativ adress, så att den fungerar både lokalt och på GitHub Pages.
        const data = await hamtaJson("data/standings.json");
        const lagen = data.standings.sort((a, b) => a.leagueSequence - b.leagueSequence);

        const tabell = document.getElementById("tabell");
        for (const lag of lagen) {
          const rad = tabell.insertRow();
          const varden = [
            lag.leagueSequence,
            lag.teamName.default,
            lag.gamesPlayed,
            lag.wins,
            lag.losses,
            lag.otLosses,
            lag.goalDifferential > 0 ? "+" + lag.goalDifferential : lag.goalDifferential,
            `${lag.l10Wins}-${lag.l10Losses}-${lag.l10OtLosses}`,
            lag.points,
          ];
          for (const varde of varden) rad.insertCell().textContent = varde;
        }

        const tid = new Date(data.standingsDateTimeUtc).toLocaleString("sv-SE");
        status.textContent = "Tabellen hämtades " + tid;
      } catch (fel) {
        console.error(fel);
        status.textContent = "Kunde inte läsa tabellen. Kör du sidan via en lokal server?";
      }
    }

    visaMatcher();
    visaTabell();
  </script>
</body>
</html>
