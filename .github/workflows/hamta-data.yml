name: Hämta NHL-data

on:
  schedule:
    - cron: "17 7,16 * * *" # varje dag 07:17 och 16:17 UTC
  workflow_dispatch: # ger en knapp för att köra manuellt

permissions:
  contents: write # får pusha till repot
  pages: write # får be GitHub Pages bygga om sidan

concurrency: hamta-data # bara en körning åt gången

jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # senaste versionen, även om körningen har stått i kö

      - name: Hämta data
        run: python3 hamta_data.py

      - name: Spara ändringar i repot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Uppdatera NHL-data"
          git pull --rebase
          git push

      # En push från ett workflow startar inte Pages av sig själv, så vi ber om ett bygge.
      - name: Bygg om sidan
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
