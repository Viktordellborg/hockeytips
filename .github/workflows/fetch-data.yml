name: Fetch NHL data

on:
  schedule:
    - cron: "17 7,16 * * *" # every day at 07:17 and 16:17 UTC
  workflow_dispatch: # adds a button for manual runs

permissions:
  contents: write # may push to the repo
  pages: write # may ask GitHub Pages to rebuild the site

concurrency: fetch-data # only one run at a time

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # latest version, even if the run has been queued

      - name: Fetch data
        run: python3 fetch_data.py

      - name: Save changes to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update NHL data"
          git pull --rebase
          git push

      # A push from a workflow does not start Pages by itself, so we request a build.
      - name: Rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
